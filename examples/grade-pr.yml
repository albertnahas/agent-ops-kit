# Grades PRs in CI instead of in the scheduled loop. Copy to .github/workflows/.
# It comments; it never merges. Merging stays in the loop, one PR at a time.
# If your agent opens PRs as a bot, list it in allowed_bots. Commits pushed with the
# default GITHUB_TOKEN don't trigger workflows, so B fixes pushed that way aren't regraded.
name: Grade PR
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Use the pr-grader agent on PR #${{ github.event.pull_request.number }} in ${{ github.repository }}."
          claude_args: '--max-turns 40 --allowedTools "Read,Grep,Glob,Bash(gh pr *),Bash(tests/*),Bash(bash tests/*),Bash(npm *)"'
