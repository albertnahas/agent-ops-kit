# Grades PRs in CI instead of in the scheduled loop. Copy to .github/workflows/.
# It comments; it never merges. Merging stays in the loop, one PR at a time.
# If your agent opens PRs as a bot, list it in allowed_bots. Commits pushed with the
# default GITHUB_TOKEN don't trigger workflows, so B fixes pushed that way aren't regraded.
name: Grade PR
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The default branch's copy of the guard, so a PR can't change its own check. Red means X.
      - id: guard
        run: |
          git show origin/${{ github.event.repository.default_branch }}:scripts/mission-guard > /tmp/mission-guard
          python3 /tmp/mission-guard pr
      - id: orders
        if: always()
        run: |
          git diff --quiet origin/${{ github.event.repository.default_branch }} -- docs/orders || python3 /tmp/mission-guard orders
      - uses: anthropics/claude-code-action@v1
        if: always()
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Use the pr-grader agent on this PR (git diff origin/main...HEAD). The mission guard step ended ${{ steps.guard.outcome }} and the Orders check ${{ steps.orders.outcome }}. A guard that didn't succeed makes the grade X, and a failed Orders check makes it B at best, whatever the diff looks like. Post the grade and each finding as inline comments."
          claude_args: '--max-turns 40 --allowedTools "Read,Grep,Glob,Bash(git diff *),mcp__github_inline_comment__create_inline_comment"'
