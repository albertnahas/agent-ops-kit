# Runs the default branch's mission guard on every PR. Copy to .github/workflows/ and make
# "mission-guard" a required check (branch protection or a ruleset). A red check is X.
# pull_request_target runs this file as it is on the default branch, so a PR can't edit or
# drop it. It checks out the PR's files but never runs them: the guard only reads them with git.
name: Mission guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
jobs:
  mission-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: git show origin/${{ github.event.repository.default_branch }}:scripts/mission-guard > "$RUNNER_TEMP/mission-guard"
      - run: python3 "$RUNNER_TEMP/mission-guard" pr
      - name: Orders check, when the PR touches docs/orders/
        run: git diff --quiet origin/${{ github.event.repository.default_branch }} -- docs/orders || python3 "$RUNNER_TEMP/mission-guard" orders
